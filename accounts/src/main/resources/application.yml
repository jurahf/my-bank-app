server:
  port: 8081
  
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bankdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: accounts
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
