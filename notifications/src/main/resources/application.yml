server:
  port: 8083
spring:
  application:
    name: notifications
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank
  config:
    import:
      - "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: notifications
      config:
        enabled: true            # Включаем Consul Config для внешней конфигурации
        defaultContext: application